<script>
/* IoT Security Sandbox — DEMO sign-in (no server). Accounts are kept in this browser only. */
(function () {
  'use strict';
  const FIXED = {
    sam: { username: 'sam', name: 'Sam', role: 'admin', pw: 'cdac@123' },
    iotsecurity: { username: 'iotsecurity', name: 'IoT Security Team', role: 'tester', pw: 'cdac@123' },
    abb: { username: 'ABB', name: 'ABB', role: 'vendor', pw: 'cdac@123', company: 'ABB' }
  };
  const ROLE_KEYS = ['gn62443.role', 'iotsbx.medical.role', 'iotsbx.automotive.role', 'iotsbx.consumer.role'];
  const ROLE_LABEL = { admin: 'Administrator', tester: 'Tester', vendor: 'Vendor' };
  const LS_USERS = 'sbx.demo.users', LS_SESSION = 'sbx.demo.session';
  const get = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
  const set = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };
  const users = () => Object.assign({}, get(LS_USERS, {}), FIXED);
  const escH = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  async function hash(pw) {
    try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('sbx-demo:' + pw)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
    catch (e) { return 'plain:' + pw; }
  }
  async function pwOk(u, pw) { return u.pw ? u.pw === pw : u.hash === await hash(pw); }
  function setRoleKeys(role) { ROLE_KEYS.forEach(k => set(k, role || null)); }

  // Runs before the portal reads its saved role, so the account's role applies straight away.
  const me = (() => { const id = get(LS_SESSION, null); const u = id && users()[id]; return u ? Object.assign({ id }, u) : null; })();

  const st = document.createElement('style');

  function overlay() {

    ov.className = 'sbx-ov';

<style>
/* Same visual language as the 62443-4-2 Compliance Portal: dark instrument-strip header, teal accent, IBM Plex */

}

function fromHash(){
  const h=(location.hash||'').slice(1);
  const m=h.match(/^(ics|automotive|medical|consumer)(-portal|-new|-assess|-tester|-report|-map)?$/);
  if(!m){S.view='domain';return;}
  const d=DOMAINS[m[1]];
  if(S.domain!==d.key){S.domain=d.key;S.std=null;}
  if(!S.std&&d.key==='consumer'){const s0=ls.get('iotsbx.consumer.std');if(d.standards.some(x=>x.id===s0))S.std=s0;}
  const flowStd=()=>{const st=d.standards.find(x=>x.id===S.std);return !st||st.flow;};
  if(d.flow&&m[2])useProfile(d.key==='consumer'&&S.std===CONS_ER_STD?'consumer_er':d.key);
  if(d.key==='ics'&&m[2]==='-portal'){if(!S.std)S.std='62443-4-2';S.view='ics';}
  else if(d.flow&&m[2]==='-map'){if(!S.std)S.std=d.standards[0].id;S.view='mmap';}
  else if(d.flow&&m[2]==='-tester'){if(!S.std)S.std=d.standards[0].id;S.view='mtester';}
  else if(d.flow&&m[2]==='-report'){if(!S.std)S.std=d.standards[0].id;S.view=S.rapp?'mreport':'mlanding';}
  else if(d.flow&&(m[2]==='-assess'||m[2]==='-new')){if(!S.std)S.std=d.standards[0].id;S.view=S.app?'massess':'mlanding';}
  else if(d.flow&&m[2]==='-portal'){if(!S.std)S.std=d.standards[0].id;S.view=flowStd()?'mlanding':'demo';if(S.view==='mlanding')S.app=null;}
  else if(m[2]&&!d.live){S.view='demo';if(!S.std)S.std=d.standards[0].id;}
  else S.view='standard';
}
function go(hash){
  const want=hash?'#'+hash:'';
  if(location.hash===want){fromHash();render();}
  else{try{location.hash=want||'#';}catch(e){fromHash();render();}}
  window.scrollTo(0,0);
}

  if(p.type==='check'){const v=!!(a.v||{})[p.k];return `<label class="opt" style="max-width:440px"><input type="checkbox" data-qchk="${q.id}" data-k="${p.k}" ${v?'checked':''}><span>${esc(p.label)}</span></label>`;}

    const f=(a.files||{})[p.k];const key=q.id+'|'+p.k;
    const inner=f?fileRow(f,`data-a="qfile-rm" data-q="${q.id}" data-k="${p.k}"`,(f.name.split('.').pop()||'').toUpperCase().slice(0,4),S.hashing===key)
      :`<span class="muted small">Drag &amp; drop file here</span><label class="btn">Choose file<input type="file" hidden accept="${esc(p.accept)}" data-qup="${key}"></label><span class="small muted">${p.accept==='.pdf'?'PDF file':esc(p.accept.split(',').join('  '))}</span>`;
    return `<div class="field"><span class="lbl ${p.opt?'':'req'}">${esc(p.label)}</span><div class="drop" data-qdrop="${key}">${inner}</div></div>`;}

/* ---------- Step 4 · Review & submit ---------- */
function ansSummary(q,a,app){
  a=a||{};if(q.na&&a.na)return `<span class="muted">${esc(q.na)}</span>`;
  const out=[];
  q.parts.forEach(p=>{
    if(p.show&&!p.show(a,app))return;
    if(p.type==='multi'){if(a.none)out.push(esc(p.none));else{const xs=[...selOf(a)];if(otherOk(a))xs.push('Other: '+a.otherText.trim());if(xs.length)out.push((p.label?`<span class="muted">${esc(p.label)}:</span> `:'')+xs.map(esc).join(', '));
      optSubs(p,a).forEach(({label,key,parts})=>parts.forEach(sp=>{
        if(sp.type==='file'){const f=(a.files||{})[key+sp.k];if(f)out.push(`<span class="muted">${esc(label)} · ${esc(sp.label)}:</span> ${fileLink(f)}`);}
        else if(sp.type==='text'){const v=((a.v||{})[key+sp.k]||'').trim();if(v)out.push(`<span class="muted">${esc(label)} · ${esc(sp.label.split(' (')[0])}:</span> ${esc(v.length>140?v.slice(0,140)+'…':v)}`);}}));}}
    else if(p.type==='table'){const rows=tabRows(a,p).filter(r=>p.cols.some(c=>(r[c.k]||'').trim()));
      if(rows.length)out.push(`<span class="muted">${esc(p.label)} (${rows.length} row${rows.length>1?'s':''}):</span> `+rows.slice(0,4).map(r=>esc(p.cols.map(c=>r[c.k]||'—').join(' · '))).join('; ')+(rows.length>4?' …':''));}
    else if(p.type==='text'){const v=((a.v||{})[p.k]||'').trim();
      if(p.secret){if(v||app.status==='submitted')out.push(`<span class="muted">${esc(p.label)}:</span> ${v?'provided (hidden)':'given at submission, not stored'}`);}
      else if(v)out.push(`<span class="muted">${esc(p.label)}:</span> ${esc(v.length>160?v.slice(0,160)+'…':v)}`);}
    else if(p.type==='num'){const v=(a.v||{})[p.k];if(isNum(v))out.push(`<span class="muted">${esc(p.label)}:</span> ${esc(v)} ${esc(p.unit)}`);}
    else if(p.type==='check'){if((a.v||{})[p.k])out.push(esc(p.label));}
    else if(p.type==='file'){const f=(a.files||{})[p.k];if(f)out.push(`<span class="muted">${esc(p.label.replace(/\s*\(PDF\).*$/,''))}:</span> ${fileLink(f)}`);}
    else if(p.type==='note'){out.push(`<span class="muted">${p.html(app)}</span>`);}
  });
  return out.join('<br>')||'<span class="muted">—</span>';}
function crTable(list){

    rows.push(`<tr><td class="mono nowrap">${esc(goiId(e))}</td>${P.hasRef?`<td class="mono nowrap">${esc(crName(e))}</td>`:''}<td>${esc(crTitle(e))}</td><td><div class="chips">${e.src.map(s=>`<span class="idchip">${esc(srcLabel(s))}</span>`).join('')}</div></td></tr>`);});
  return `<div class="tw"><table><thead><tr><th>ID</th>${P.hasRef?'<th>Requirement</th>':''}<th>Title</th><th>Evidence from</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;}
function medDevCard(app,locked){const d=app.dev||{},f=app.files||{};return `<div class="card stack"><div class="section-h"><h3>Device</h3>${locked?'':'<button class="btn sm" data-a="m-step" data-k="details">Edit</button>'}</div>

      <dt>Application</dt><dd>${d.app==='cms'?'CMS':d.app==='mobile'?'Mobile app':d.app==='web'?'Web app':'—'}${d.appn?' · '+esc(d.appn):''}</dd><dt>Manual</dt><dd>${f.manual?fileLink(f.manual):'—'}</dd><dt>Firmware file</dt><dd>${f.fwzip||f.fwbin?fileLink(f.fwzip||f.fwbin)+((f.fwzip||f.fwbin).sha?`<div class="hash mono small muted" style="overflow-wrap:anywhere">SHA-256 ${esc((f.fwzip||f.fwbin).sha)}</div>`:''):'—'}</dd></dl></div>`;}
function mReview(app){

  else if(!ready)banner=`<div class="banner warn"><b>Not ready to submit.</b><span>${devMiss.length?`Step 1 needs: ${esc(devMiss.length)} field${devMiss.length>1?'s':''}${(P.secretFields||[]).length?' (credentials are not kept between visits — re-enter them)':''}. `:''}${inc.length?`${inc.length} questionnaire item${inc.length>1?'s':''} incomplete: ${inc.map(it=>it.id).join(', ')}.`:''}</span></div>`;
  else banner=`<div class="banner info"><b>Everything is answered.</b><span>Check the ${P.reqWord} mapping below, then submit. Responses lock when you submit.</span></div>`;
  const rows=items.map((it,n)=>{const ok=itemDone(it,app);
    const body=itemEls(it,app).map((id,k)=>{const g=MG[id];const a=g?(app.gates[id]===true?esc(g.yes||'Yes'):app.gates[id]===false?esc(g.no||'No'):'<span class="muted">—</span>'):ansSummary(MQI[id],ans(app,id),app);
      return `<div ${k?'class="subrow"':''}><div style="font-weight:500">${k?`<span class="mono small muted">${id}</span> `:''}${esc(elTitle(id,app))}</div><div class="small" style="margin-top:4px">${a}</div></div>`;}).join('');
    return `<tr ${locked?'':`class="clickable" data-a="goto-q" data-q="${it.id}"`}><td class="mono nowrap">${n+1}. ${it.id}</td><td>${body}</td><td>${ok?'<span class="pill ok">Complete</span>':'<span class="pill demo">Incomplete</span>'}</td></tr>`;}).join('');
  const d=app.dev,f=app.files;
  return `${banner}
  <section class="tiles"${P.levels?'':' style="grid-template-columns:repeat(3,minmax(0,1fr))"'}>
    ${P.levels?`<div class="tile"><b>${lvl(app.sl)}</b><span>declared ${P.levelWord==='Level'?'level':P.levelWord}</span></div>`:''}
    <div class="tile"><b>${yes} / ${gs.length}</b><span>Yes/No questions answered Yes</span></div>
    <div class="tile"><b>${items.length-inc.length} / ${items.length}</b><span>questionnaire items complete</span></div>
    <div class="tile"><b>${inList.length}</b><span>${P.reqWord}s in scope · ${exList.length} excluded</span></div>
  </section>
  <section class="grid2">
    ${P.devCard(app,locked)}
    <div class="card stack"><div class="section-h"><h3>Yes / No answers</h3>${locked?'':`<button class="btn sm" data-a="goto-q" data-q="${MGATES[0].id}">Edit</button>`}</div>
      <div class="chips">${gs.map(g=>`<span class="gchip ${app.gates[g.id]?'y':''}" title="${esc(g.q)}"><b>${g.id}</b>${app.gates[g.id]===true?esc(g.yes||'Yes'):app.gates[g.id]===false?esc(g.no||'No'):'—'}</span>`).join('')}</div>
      <p class="small muted">Hover a chip to see the question.</p></div>
  </section>
  <section class="stack">
    <div class="section-h"><h3>${P.reqWord} mapping · ${inList.length} requirements in scope</h3><span class="small muted">${esc(P.mapNote)}</span></div>
    ${crTable(inList)}
    ${exList.length?`<details class="card ex"><summary>${exList.length} ${P.reqWord}s excluded by applicability answers</summary><div class="tw" style="margin-top:12px"><table><thead><tr><th>ID</th>${P.hasRef?'<th>Requirement</th>':''}<th>Title</th><th>Why excluded</th></tr></thead><tbody>${exList.map(e=>`<tr><td class="mono nowrap">${esc(goiId(e))}</td>${P.hasRef?`<td class="mono nowrap">${esc(crName(e))}</td>`:''}<td>${esc(crTitle(e))}</td><td class="small">${esc(e.why.join('; '))}</td></tr>`).join('')}</tbody></table></div></details>`:''}
  </section>

function mReach(k,app){if(app.status==='submitted')return k==='review';if(k==='details')return true;if(!app.detailsOk)return false;if(k==='sl')return true;return !!app.sl;}
function mDone(k,app){if(k==='details')return !!app.detailsOk;if(k==='sl')return !!app.sl;if(k==='quest')return !!app.sl&&visibleItems(app).every(it=>itemDone(it,app));return app.status==='submitted';}
function stdObj(){const d=DOMAINS[P.key];return d.standards.find(s=>s.id===(S.app&&S.app.std||S.std||P.std))||d.standards[0];}
function medApp(){
  const app=S.app;if(!app)return medLanding();
  const st=app.status==='submitted'?['ok','Submitted']:['draft','Draft'];
  const head=`<div class="apphead"><div class="stack" style="gap:6px">
      <span class="eyebrow">${esc(DOMAINS[P.key].name)} · ${esc(stdObj().code)} · ${esc(app.id||'New assessment')}</span>
      <h2 style="font-size:28px">${esc(P.devName(app)||P.newTitle)}</h2>
      <div class="meta">${P.devVendor(app)?`<span>${esc(P.devVendor(app))}</span>`:''}${P.levels&&app.sl?`<span>Declared ${lvl(app.sl)}</span>`:''}<span class="pill ${st[0]}">${st[1]}</span></div>
    </div><button class="btn quiet" data-a="to-landing">← All applications</button></div>`;
  const steps=`<nav class="stepper" aria-label="Assessment steps">${P.steps.map(([k,t],i)=>{const r=mReach(k,app),cur=S.mstep===k;
    return `<div class="s ${mDone(k,app)?'ok':''} ${r?'':'off'}" ${cur?'aria-current="step"':''} ${r&&!cur?`role="button" tabindex="0" data-a="m-step" data-k="${k}"`:''}><span class="n">STEP ${i+1}</span><span class="t">${t}</span></div>`;}).join('')}</nav>`;
  if(!mReach(S.mstep,app))S.mstep=app.status==='submitted'?'review':'details';
  const body=S.mstep==='details'?mDetails():S.mstep==='sl'?mSL(app):S.mstep==='quest'?mQuest(app):mReview(app);
  return head+steps+body;}

function mapView(){
  if(!P.levels)return mapViewFlat();
  const L=P.levelList,top=L[L.length-1];if(!L.includes(S.mapSL))S.mapSL=top;

  const minSL=k=>L.find(n=>full[n-1].has(k));const lvsOf=k=>L.filter(n=>full[n-1].has(k));
  const frs=P.groups.filter(f=>all.some(([k,e])=>frOf(e)===f));

  MGATES.forEach(g=>{sim.gates[g.id]=!!S.mapGates[g.id];});
  const inS=crSources(sim,false);const atSL=full[S.mapSL-1];
  const appl=e=>{const gs=new Set(),dep=new Set();let open=false;e.src.forEach(id=>{if(id===ALWAYS){open=true;return;}if(MG[id]){gs.add(id);return;}const q=MQI[id];if(q.gate&&!q.gateAny)gs.add(q.gate);else if(q.dep)dep.add(q.dep);else open=true;});
    return open?'All devices':gs.size?[...gs].join(', '):'Follow-up to '+[...dep].join(', ');};
  const rows=all.filter(([k,e])=>S.mapFR==='all'||String(frOf(e))===String(S.mapFR));
  const RW=P.reqWord+'s',noGroups=P.groups.filter(f=>!frs.includes(f));
  return `<div class="section-h"><div class="stack" style="gap:4px"><span class="eyebrow">${esc(DOMAINS[P.key].name)} · ${esc(stdObj().code)}</span><h2>Requirement map</h2></div></div>
  <section class="card stack"><h3>${RW} by ${P.levelWord}</h3><p class="small muted">Effect of the ${P.levelWord} filter alone, with every Yes/No question answered Yes and every follow-up triggered. ${P.indepLevels?'Each level has its own requirement list.':'Levels are cumulative.'}</p>
    <div class="tw"><table><thead><tr><th>${esc(P.groupWord)}</th>${L.map(n=>`<th class="num">${lvl(n)}</th>`).join('')}</tr></thead><tbody>
      ${frs.map(f=>`<tr><td>${esc(P.groupName(f))}</td>${full.map(m=>`<td class="num">${[...m.values()].filter(e=>frOf(e)===f).length}</td>`).join('')}</tr>`).join('')}</tbody>

  <section class="card stack" style="gap:18px"><div class="section-h"><h3>Try the filters</h3><span class="small"><b>${inS.size}</b> of ${atSL.size} ${RW} at ${lvl(S.mapSL)} apply · <b>${visibleQs(sim).length}</b> detail questions asked</span></div>

function okExt(name,accept){if(!accept)return true;const n=name.toLowerCase();return accept.split(',').some(x=>n.endsWith(x.trim()));}
async function addFile(key,file){

  if(!okExt(file.name,u.accept)){toast(`${file.name}: expected ${u.accept.replace(/,/g,', ')}.`);return;}
  dropAsset(S.app.files[key]);const rec={name:file.name,size:file.size,sha:null};S.app.files[key]=rec;delete S.errs[key];
  S.hashing=key;render();if(file.size<=512*1024*1024)rec.sha=await sha256(file);await storeAsset(file,rec);S.hashing=null;
  render();}
async function addQFile(qid,k,file){

  if(!okExt(file.name,p.accept)){toast(`${file.name}: expected ${p.accept.replace(/,/g,', ')}.`);return;}
  const a=qa(qid);a.files=a.files||{};dropAsset(a.files[k]);const rec={name:file.name,size:file.size,sha:null};a.files[k]=rec;
  const key=qid+'|'+k;S.hashing=key;render();if(file.size<=512*1024*1024)rec.sha=await sha256(file);await storeAsset(file,rec);S.hashing=null;
  render();}
function findPart(q,k){
  for(const p of q.parts){if(p.k===k)return p;
    if(p.type==='multi'&&(p.each||p.per)){const m=k.match(/^(.+?)~(\d+|o)~(.+)$/);if(m&&m[1]===p.k){const o=m[2]==='o'?'__other':p.opts[+m[2]];const parts=(p.per&&p.per[o])||p.each||[];const sp=parts.find(x=>x.k===m[3]);if(sp)return sp;}}}
  return null;}

const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);

const nowISO=()=>new Date().toISOString();

const fmtDay=iso=>{if(!iso)return '—';try{return new Date(iso).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}catch(e){return iso;}};
function makeStore(name,col){
  const MKEY='iotsbx.'+name+'.apps.v1',AKEY='iotsbx.'+name+'.asmts.v1',CKEY='iotsbx.'+name+'.config.v1';
  return {
  mode:'connecting',db:null,user:null,assets:null,downloads:null,me:{id:null},canEdit:null,
  apps:{},asmts:{},config:{},ready:false,slow:false,queues:{},
  async init(){
    const c=window.claude;
    if(!c||typeof c.use!=='function'){this.goLocal();return;}
    let r=[];try{r=await Promise.all(['db','user','assets','downloads'].map(n=>Promise.resolve(c.use(n)).catch(()=>null)));}catch(e){}
    const [db,user,assets,downloads]=r;
    this.user=user||null;this.assets=assets||null;this.downloads=downloads||null;
    if(user){try{this.me=await user.me();this.canEdit=!!this.me.canEdit;}catch(e){}}
    if(!db){this.goLocal();return;}
    this.db=db;this.mode='shared';
    const timer=setTimeout(()=>{if(!this.ready){this.slow=true;softRender();}},10000);
    const onErr=e=>{clearTimeout(timer);this.ready=true;if(e&&e.code==='revoked')toast('Access to the shared workspace changed. Reload the page.');softRender();};
    db.collection(col+'apps').onSnapshot(s=>{const m={};s.docs.forEach(d=>{if(d.exists)m[d.id]=d.data();});this.apps=m;if(!s.metadata.fromCache){clearTimeout(timer);this.slow=false;}this.ready=true;softRender();},onErr);
    db.collection(col+'asmts').onSnapshot(s=>{const m={};s.docs.forEach(d=>{if(d.exists)m[d.id]=d.data();});this.asmts=m;softRender();},onErr);
    db.doc(col+'config/site').onSnapshot(d=>{this.config=d.exists?d.data():{};softRender();},onErr);
    softRender();
  },
  goLocal(){
    this.mode='local';this.apps=ls.get(MKEY)||{};this.asmts=ls.get(AKEY)||{};this.config=ls.get(CKEY)||{};
    if(!this.me||!this.me.id)this.me={id:'local'};if(this.canEdit==null)this.canEdit=true;this.ready=true;softRender();},
  _q(key,fn){const p=(this.queues[key]||Promise.resolve()).catch(()=>{}).then(fn);this.queues[key]=p;return p;},
  putApp(id,data){
    this.apps[id]=clone(data);
    if(this.mode!=='shared'){ls.set(MKEY,this.apps);return Promise.resolve();}
    return this._q('a:'+id,()=>this.db.doc(col+'apps/'+id).set(clone(data)));},
  putAsmt(id,patch){
    const had=!!this.asmts[id];this.asmts[id]=deepMerge(clone(this.asmts[id])||{},patch);
    if(this.mode!=='shared'){ls.set(AKEY,this.asmts);return Promise.resolve();}
    const full=clone(this.asmts[id]);
    return this._q('s:'+id,()=>had?this.db.doc(col+'asmts/'+id).update(patch):this.db.doc(col+'asmts/'+id).set(full));},
  putConfig(patch){
    const had=Object.keys(this.config||{}).length>0;this.config=deepMerge(clone(this.config)||{},patch);
    if(this.mode!=='shared'){ls.set(CKEY,this.config);return Promise.resolve();}
    const full=clone(this.config);
    return this._q('cfg',()=>had?this.db.doc(col+'config/site').update(patch):this.db.doc(col+'config/site').set(full));}
};}

function errText(e){

  if(c==='quota_exceeded')return 'Shared storage is full. Delete old applications and try again.';

function fillExample(app,prefix){

        a.sel.forEach(o=>(p.per&&p.per[o]||p.each||[]).forEach(sp=>fillPart(a,sp,`${p.k}~${p.opts.indexOf(o)}~${sp.k}`,q,prefix)));}
      else fillPart(a,p,p.k,q,prefix);});
    A[q.id]=a;});}
function fillPart(a,p,key,q,prefix){
  if(p.type==='text'&&!p.secret){a.v=a.v||{};a.v[key]='Example answer (sample data).';}
  else if(p.type==='num'){a.v=a.v||{};a.v[key]=p.min&&p.min>1?p.min:24;}
  else if(p.type==='file'&&!p.opt){a.files=a.files||{};const ext=(p.accept||'.pdf').split(',')[0].replace('.','');a.files[key]=EXF(`${prefix}_${q.id}_${key.replace(/~/g,'-')}.${ext}`,150000);}

  const items=CONS_ITEMS_RAW.map(ids=>ids.filter(id=>known.has(id))).filter(ids=>ids.length).map(ids=>({id:ids[0],ids}));
  return {qs,gates,items};}

function missingCons(){
  const v=S.app.dev,f=S.app.files,e={};
  const need=(k,msg)=>{if(!(v[k]||'').trim())e[k]=msg;};
  need('vendor','Enter the vendor / OEM organisation.');need('dname','Enter the device name.');need('model','Enter the model / order number.');need('fw','Enter the firmware version.');
  if(v.ce&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.ce))e.ce='Enter a valid email address.';
  if(!f.manual)e.manual='Attach the installation / setup or user manual.';
  if(!v.app)e.app='Select the associated application.';
  else if((v.app==='mobile'||v.app==='web')&&!(v.appn||'').trim())e.appn=v.app==='mobile'?'Enter the mobile app name.':'Enter the web app name or URL.';
  else if(v.app==='cms'&&!f.cms)e.cms='Attach the CMS package or installer.';
  need('defc','Enter the default user / admin credentials.');
  if(!v.ftype)e.ftype='Select the device class.';
  else if(v.ftype==='low'&&!f.fwelf)e.fwelf='Attach the firmware in ELF format.';
  else if(v.ftype==='high'){
    if(!f.fwrel)e.fwrel='Attach the release version firmware image.';
    if(!v.fenc)e.fenc='Say whether the release firmware is encrypted.';
    else if(v.fenc==='yes'&&!f.fwdec)e.fwdec='Attach the unencrypted release version firmware.';}
  return e;}

function render(){
  const fid=document.activeElement&&document.activeElement.id;
  let v=S.view;
  window.__ICS_ACTIVE=(v==='ics');
  if(v==='ics'){
    root.innerHTML=header()+`<main class="wrap" id="ics" data-ics></main>`+footer();
    if(window.__ICS)window.__ICS.render();
    return;}
  if(['massess','mtester','mmap','mreport'].includes(v)&&!S.mrole)v='mlanding';
  if(v==='massess'&&S.mrole==='tester')v='mlanding';
  if((v==='mtester'||v==='mmap')&&(S.mrole==='vendor'||testerBlocked()))v='mlanding';
  const body=v==='domain'?domainView():v==='standard'?standardView():v==='mlanding'?medLanding():v==='massess'?medApp():v==='mtester'?(S.tapp?mTesterApp():mTesterList()):v==='mmap'?mapView():v==='mreport'?mReport():demoView();

  root.innerHTML=header()+`<main class="wrap">${banner}${body}</main>`+footer();
  if(fid){const el=document.getElementById(fid);if(el)try{el.focus({preventScroll:true});}catch(e){}}
}
function refreshQStatus(){
  if(!S.app||S.mstep!=='quest')return;const it=ITEMS.find(x=>x.id===S.item);if(!it)return;
  const miss=itemMissing(it,S.app);
  const st=root.querySelector('.qcard .qfoot .row > span');
  if(st){if(miss.length){st.className='small muted';st.style.cssText='';st.textContent='Still needed: '+miss.join('; ');}else{st.className='small';st.style.cssText='color:var(--pass);font-weight:500';st.textContent='Complete';}}

}

    return;}

});
root.addEventListener('change',e=>{
  if(e.target.closest&&e.target.closest('[data-ics]'))return;

  if(t.dataset.amapg){S.amapG=t.value;render();return;}

function applicable(app){if(!app||!app.sl)return [];return REQS.filter(r=>r.sl<=app.sl&&(r.gate==='A'||(app.gates||{})[r.gate]===true));}
function exclusion(r,app){
  if(r.sl>app.sl)return {kind:'sl',text:`Introduced at SL ${r.sl}; component declared at SL ${app.sl}.`};
  if(r.gate!=='A'&&(app.gates||{})[r.gate]!==true)return {kind:'gate',text:`${r.gate} answered No: “${GATE[r.gate].q}”`};
  return null;}
function appQuestions(app){const s=new Set();applicable(app).forEach(r=>r.qs.forEach(q=>s.add(q)));return [...s].sort((a,b)=>a-b);}
function reqsForQ(qn,app){return applicable(app).filter(r=>r.qs.includes(qn));}
function gatesDone(app){return GATES.every(g=>typeof (app.gates||{})[g.id]==='boolean');}
function multiOk(a,min){const n=(a.sel||[]).length+(a.other||[]).length;if(a.otherOn&&!(a.other||[]).length)return false;return n>=(min||1);}
function qComplete(qn,a){
  const q=QUESTIONS[qn];if(!a)return false;
  switch(q.type){
    case 'multi':return multiOk(a);
    case 'multidoc':return multiOk(a)&&(a.files||[]).length>0;
    case 'single':return !!a.one&&(a.one!=='Other'||!!(a.otherText||'').trim());
    case 'text':return !!(a.text||'').trim()&&(!q.doc||(a.files||[]).length>0);
    case 'number':return a.na===true||(typeof a.num==='number'&&isFinite(a.num)&&a.num>=(q.min||0));
    case 'firmware':return (a.files||[]).length>0;
    case 'groups':{const g=a.groups||{};let any=false;for(const G of q.groups){const x=g[G.k]||{};if(x.otherOn&&!(x.other||[]).length)return false;if((x.sel||[]).length||(x.other||[]).length)any=true;}return any;}
  }return false;}
function missingFor(qn,a){
  const q=QUESTIONS[qn];a=a||{};
  if(q.type==='text'){const m=[];if(!(a.text||'').trim())m.push('a written answer');if(q.doc&&!(a.files||[]).length)m.push('a supporting PDF');return m.length?'Add '+m.join(' and ')+'.':'';}
  if(q.type==='multidoc'){const m=[];if(!multiOk(a))m.push('at least one option');if(!(a.files||[]).length)m.push('the update procedure PDF');return m.length?'Add '+m.join(' and ')+'.':'';}
  if(q.type==='firmware')return (a.files||[]).length?'':'Attach the firmware .zip.';
  if(q.type==='number')return qComplete(qn,a)?'':`Enter a value of ${q.min||0} or more, or mark it as not supported.`;
  if(q.type==='single')return !a.one?'Select one option.':(a.one==='Other'&&!(a.otherText||'').trim())?'Describe the other option.':'';
  if(q.type==='groups'||q.type==='multi'){if(a.otherOn&&!(a.other||[]).length)return 'Add the “Other” entry, or untick Other.';return qComplete(qn,a)?'':'Select at least one option.';}
  return '';}
function appStatus(app,asmt){

  if(app.status==='draft')return {k:'draft',t:'Draft'};
  if(asmt&&asmt.status==='completed')return {k:'done',t:'Assessment complete'};

function verdictCounts(app,asmt){const reqs=applicable(app);let p=0,f=0;const v=(asmt&&asmt.verdicts)||{};reqs.forEach(r=>{const x=v[r.k];if(x&&x.v==='pass')p++;else if(x&&x.v==='fail')f++;});return {total:reqs.length,pass:p,fail:f,done:p+f};}

const LKEY='gn62443.local.v1';
const Store={
  mode:'connecting',db:null,user:null,assets:null,downloads:null,me:{id:null},canEdit:null,
  apps:{},asmts:{},config:{},appsReady:false,
  async init(){
    const c=window.claude;
    if(!c||typeof c.use!=='function'){this.goLocal();return;}
    let r=[];
    try{r=await Promise.all(['db','user','assets','downloads'].map(n=>Promise.resolve(c.use(n)).catch(()=>null)));}catch(e){}
    const [db,user,assets,downloads]=r;
    this.user=user||null;this.assets=assets||null;this.downloads=downloads||null;
    if(user){try{this.me=await user.me();this.canEdit=!!this.me.canEdit;}catch(e){}}
    if(!db){this.goLocal(true);return;}
    this.db=db;this.mode='shared';
    const onErr=e=>{if(e&&e.code==='revoked')toast('Access to the shared workspace changed. Reload the page.');};
    db.collection('applications').onSnapshot(s=>{const m={};s.docs.forEach(d=>{if(d.exists)m[d.id]=d.data();});this.apps=m;this.appsReady=true;softRender();},onErr);
    db.collection('assessments').onSnapshot(s=>{const m={};s.docs.forEach(d=>{if(d.exists)m[d.id]=d.data();});this.asmts=m;softRender();},onErr);
    db.doc('config/site').onSnapshot(d=>{this.config=d.exists?d.data():{};softRender();},onErr);
    softRender();
  },
  goLocal(hasClaude){
    const d=ls.get(LKEY)||{};
    this.mode='local';this.apps=d.apps||{};this.asmts=d.asmts||{};this.config=d.config||{};
    if(!this.me||!this.me.id)this.me={id:'local'};
    if(this.canEdit==null)this.canEdit=true;
    this.appsReady=true;softRender();},
  persist(){if(this.mode==='local')ls.set(LKEY,{apps:this.apps,asmts:this.asmts,config:this.config});},
  async _write(col,id,patch,create){
    const map=col==='applications'?this.apps:col==='assessments'?this.asmts:null;
    const exists=map?!!map[id]:!!Object.keys(this.config||{}).length;
    // optimistic local copy
    if(map){map[id]=deepMerge(clone(map[id])||{},patch);}else{this.config=deepMerge(clone(this.config)||{},patch);}
    if(this.mode==='local'){this.persist();return;}
    const ref=this.db.doc(col+'/'+id);
    if(create||!exists)await ref.set(map?clone(map[id]):clone(this.config));
    else await ref.update(patch);
  },
  createApp(id,data){return this._write('applications',id,data,true);},
  updateApp(id,patch){return this._write('applications',id,patch);},
  async deleteApp(id){delete this.apps[id];if(this.mode==='local'){this.persist();return;}await this.db.doc('applications/'+id).delete();},
  putAsmt(id,patch){return this._write('assessments',id,patch);},
  putConfig(patch){return this._write('config','site',patch);}
};
function errText(e){
  const c=e&&e.code;
  if(c==='invalid_argument')return 'This change was refused. Recording verdicts and settings needs edit access to this page; ask the owner to add you as an Editor.';
  if(c==='quota_exceeded')return 'Shared storage is full. Delete old drafts and try again.';
  if(c==='resource_exhausted')return 'Too many changes at once. Wait a moment and try again.';
  return (e&&e.message)||'The change could not be saved.';}

let pendingRender=false;

function softRender(force){if(!force&&isTyping()){pendingRender=true;return;}render();}
document.addEventListener('focusout',()=>{setTimeout(()=>{if(pendingRender&&!isTyping()){pendingRender=false;render();}},0);});

function render(){

};

function navItems(){

function body(){

function workflowBlock(focus,note){

const NOTE_FILTERS='Two filters set the requirement list before any testing starts: the declared Security Level (applied in the background), then the vendor’s Yes/No answers on component capability. Requirements marked “applicable to all devices” are only subject to the Security Level filter.';
function vendorStats(){let d=0,s=0,c=0;myApps().forEach(x=>{const k=appStatus(x,Store.asmts[x.id]).k;if(k==='draft')d++;else if(k==='done')c++;else s++;});return {d,s,c};}
function testerStats(){let o=0,p=0,c=0;Object.entries(Store.apps).forEach(([id,a])=>{if(!a.status||a.status==='draft')return;const k=appStatus(a,Store.asmts[id]).k;if(k==='open')o++;else if(k==='prog')p++;else if(k==='done')c++;});return {o,p,c};}
function statLine(pairs){if(!Store.appsReady)return '<span class="rc-stat">Loading…</span>';return `<span class="rc-stat">${pairs.map(([n,l])=>`<span><b>${n}</b> ${l}</span>`).join('')}</span>`;}

const HERO_ALL=['IEC 62443-4-2 · Component requirements · Embedded devices','Assess an embedded component against IEC 62443-4-2','Vendors declare a Security Level, answer the applicability and assurance questionnaires and attach evidence. Testers assess every applicable requirement and issue the compliance report.'];

/* ---------- Vendor application ---------- */
const STEPS=[['details','Component details'],['sl','Security Level'],['gates','Applicability'],['assurance','Assurance'],['review','Review & submit']];
function stepReachable(k,d){
  if(k==='details')return true;
  if(!d.id)return false;
  if(k==='sl')return true;
  if(k==='gates')return !!d.sl;
  if(k==='assurance'||k==='review')return !!d.sl&&gatesDone(d);
  return false;}
function stepDone(k,d){
  if(k==='details')return !!d.id;
  if(k==='sl')return !!d.sl;
  if(k==='gates')return gatesDone(d);
  if(k==='assurance')return d.sl&&gatesDone(d)&&appQuestions(d).every(q=>qComplete(q,(d.answers||{})[q]));
  return d.status!=='draft';}
function vendorApp(){
  const d=S.draft;if(!d)return '';

  if(locked)return vendorLocked(d);
  const st=appStatus(d,null);
  return `<div class="apphead"><div class="stack" style="gap:6px">
      <span class="eyebrow">${d.id?esc(d.id):'New assessment'}</span>
      <h2>${esc(d.meta?.component||'New component')}</h2>
      <div class="meta">${d.meta?.vendor?`<span>${esc(d.meta.vendor)}</span>`:''}${d.sl?`<span>Declared SL ${d.sl}</span>`:''}<span class="pill ${st.k}">${st.t}</span></div>

  ${S.step==='details'?stepDetails(d):S.step==='sl'?stepSL(d):S.step==='gates'?stepGates(d):S.step==='assurance'?stepAssurance(d):stepReview(d)}`;}

function stepDetails(d){

  const f=(id,label,ph,req,type)=>`<div class="field"><label for="f-${id}" class="${req?'req':''}">${label}</label><input id="f-${id}" type="${type||'text'}" data-f="meta.${id}" value="${esc(m[id]||'')}" placeholder="${esc(ph||'')}"></div>`;
  return `<section class="card stack lg">
    <div class="stack" style="gap:4px"><h3>Initiate assessment</h3><p class="muted small">Identify the component under assessment. Scope is embedded devices; software applications, host devices and network devices are out of scope.</p></div>
    <div class="form">
      ${f('vendor','Vendor / OEM organisation','e.g. Example Automation Pvt Ltd',true)}
      ${f('component','Component name','e.g. EX-200 Controller',true)}
      ${f('model','Model / order number','e.g. EX-200-1214C',true)}
      <div class="field"><label for="f-ctype" class="req">Component type</label><select id="f-ctype" data-f="meta.ctype"><option value="">Select…</option>${COMPONENT_TYPES.map(t=>`<option ${m.ctype===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
      ${f('hw','Hardware version','e.g. HW 03')}
      ${f('fw','Firmware version','e.g. V2.4.1',true)}
      ${f('contact','Contact person','Name of the vendor’s point of contact')}
      ${f('email','Contact email','name@company.com',false,'email')}
      <div class="field full"><label for="f-desc">Short description</label><textarea id="f-desc" data-f="meta.desc" placeholder="What the component does and where it is deployed…" style="min-height:80px">${esc(m.desc||'')}</textarea></div>
      <div style="grid-column:1/-1;display:flex;flex-direction:column;gap:6px">${uploadField(21,(d.answers||{})[21]||{},'.zip','ZIP','Firmware package: signed and unsigned (.zip)')}
        <p class="help">Put both the signed and the unsigned firmware images in one .zip file. This also answers Q21 of the assurance questionnaire, so you will not be asked for it again.</p></div>
    </div>
    <div class="qfoot"><span class="small muted">Fields marked * are required.</span><button class="btn primary" data-a="save-details">Save & Continue →</button></div>
  </section>`;}

function stepSL(d){
  return `<section class="card stack lg">
    <div class="stack" style="gap:4px"><h3>Declare the target Security Level</h3><p class="muted small">The component is assessed against every requirement at the declared level and the levels below it.</p></div>

  </section>`;}

function stepGates(d){
  const g=d.gates||{};const n=GATES.filter(x=>typeof g[x.id]==='boolean').length;
  const warn=g.A6===true&&g.A1===false;
  return `<section class="card stack lg">

    <div class="gates">${GATES.map(x=>`<div class="gate"><span class="gid">${x.id}</span><div><div class="gq">${esc(x.q)}</div><div class="gg">Governs: ${esc(x.gov)}</div></div>
      <div class="seg" role="group" aria-label="${x.id}"><button class="yes" data-a="set-gate" data-g="${x.id}" data-v="1" aria-pressed="${g[x.id]===true}">Yes</button><button data-a="set-gate" data-g="${x.id}" data-v="0" aria-pressed="${g[x.id]===false}">No</button></div></div>`).join('')}</div>
    ${warn?`<div class="banner warn">A6 says remote human access is allowed but A1 says no human user access. Check both answers.</div>`:''}
    <div class="qfoot"><button class="btn quiet" data-a="goto-step" data-step="sl">← Back</button><div class="row">${n<GATES.length?`<span class="small muted">Answer all ${GATES.length} questions to continue.</span>`:''}<button class="btn primary" data-a="save-gates" ${n<GATES.length?'disabled':''}>Save & Continue →</button></div></div>
  </section>`;}

function stepAssurance(d){
  const qs=appQuestions(d);if(!qs.length)return '';
  if(S.qi>=qs.length)S.qi=qs.length-1;if(S.qi<0)S.qi=0;
  const qn=qs[S.qi];const a=(d.answers||{})[qn]||{};
  const done=qs.filter(q=>qComplete(q,(d.answers||{})[q])).length;
  return `<div class="split">
    <aside class="pane sticky"><div class="pane-h"><div class="row between"><b>Assurance questions</b><span class="small muted tnum">${done} / ${qs.length}</span></div>

      <div class="pane-b">${qs.map((q,i)=>`<button class="qitem" data-a="goto-q" data-i="${i}" ${i===S.qi?'aria-current="true"':''}><span class="qn">Q${q}</span><span class="qt">${esc(QUESTIONS[q].t)}</span><span class="dot ${qComplete(q,(d.answers||{})[q])?'ok':''}"></span></button>`).join('')}</div></aside>
    <section class="card qcard">${questionForm(qn,a,d)}
      <div class="qfoot"><button class="btn quiet" data-a="q-prev">← ${S.qi===0?'Applicability':'Previous'}</button>
      <div class="row">${qComplete(qn,a)?'':`<span class="small muted">${esc(missingFor(qn,a))}</span>`}<button class="btn primary" data-a="q-save" data-q="${qn}">${S.qi===qs.length-1?'Save & Review →':'Save & Continue →'}</button></div></div>
    </section></div>`;}

function questionForm(qn,a,d){
  const q=QUESTIONS[qn];const linked=reqsForQ(qn,d);
  let h=`<div class="row between"><span class="tag">${TYPE_LABEL[q.type==='text'&&!q.doc?'textonly':q.type]}</span><span class="small muted">Question ${S.qi+1} of ${appQuestions(d).length}</span></div>
    <div class="stack" style="gap:8px"><div class="qtitle"><span class="mono muted">Q${qn}.</span> ${esc(q.t)}</div>
    <div class="row" style="gap:6px"><span class="small muted">Evidence for</span>${linked.map(r=>`<span class="idchip" title="${esc(r.cr+' '+r.title)}">${esc(r.id)}</span>`).join('')}</div></div>`;
  switch(q.type){
    case 'multi':h+=multiField(qn,'',q.opts,q.other,a,q.hint);break;
    case 'multidoc':h+=multiField(qn,'',q.opts,q.other,a,q.hint)+uploadField(qn,a,'.pdf','PDF',q.docLabel);break;
    case 'groups':h+=`<p class="help">${esc(q.hint)}</p>`+q.groups.map(G=>`<div><div class="grouplbl">${esc(G.label)}</div>${multiField(qn,G.k,G.opts,G.other,(a.groups||{})[G.k]||{},'')}</div>`).join('');break;
    case 'single':h+=`<div class="field"><label for="q-${qn}-one" class="req">${esc(q.hint)}</label><select id="q-${qn}-one" data-qs="${qn}"><option value="">Select…</option>${q.opts.concat(['Other']).map(o=>`<option ${a.one===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>
      ${a.one==='Other'?`<div class="field"><label for="q-${qn}-ot" class="req">${esc(q.other)}</label><input id="q-${qn}-ot" type="text" data-qa="otherText" data-q="${qn}" value="${esc(a.otherText||'')}"></div>`:''}`;break;
    case 'text':h+=`<div class="field"><label for="q-${qn}-text" class="req">Answer</label><textarea id="q-${qn}-text" data-qa="text" data-q="${qn}" placeholder="${esc(q.ph||'')}">${esc(a.text||'')}</textarea></div>`+(q.doc?uploadField(qn,a,'.pdf','PDF','Supporting document / evidence'):'');break;
    case 'number':h+=`<div class="field" style="max-width:360px"><label for="q-${qn}-num" class="req">${esc(q.label)}</label><div class="row" style="flex-wrap:nowrap"><input id="q-${qn}-num" type="number" min="${q.min||0}" step="1" inputmode="numeric" data-qa="num" data-q="${qn}" value="${a.num??''}" ${a.na?'disabled':''}><span class="muted">${esc(q.unit)}</span></div></div>
      <label class="opt" style="max-width:420px"><input type="checkbox" data-qna="${qn}" ${a.na?'checked':''}><span>Not supported by the component</span></label>`;break;
    case 'firmware':h+=`<p class="help">${esc(q.hint)}</p>`+((a.files||[]).length?`<div class="banner ok"><b>Auto-filled from Component details.</b><span>This is the package uploaded there. Replacing it here also updates Component details.</span></div>`:'')+uploadField(qn,a,'.zip','ZIP','Firmware package');break;
  }
  if(['multi','single','number','groups','multidoc'].includes(q.type))
    h+=`<div class="field"><label for="q-${qn}-notes">Notes for the tester <span class="muted">(optional)</span></label><textarea id="q-${qn}-notes" data-qa="notes" data-q="${qn}" style="min-height:70px" placeholder="${qn===38?'Port numbers and services, e.g. TCP 443 (HTTPS), TCP 102 (engineering)…':'Context that helps the tester verify this answer…'}">${esc(a.notes||'')}</textarea></div>`;
  return h;}
function multiField(qn,g,opts,otherLbl,a,hint){
  const sel=a.sel||[];const oid=`oth-${qn}-${g||'x'}`;
  return `${hint?`<p class="help">${esc(hint)}</p>`:''}<div class="opts">${opts.map((o,i)=>`<label class="opt"><input type="checkbox" id="cb-${qn}-${g||'x'}-${i}" data-ms="${qn}" data-g="${g}" value="${esc(o)}" ${sel.includes(o)?'checked':''}><span>${esc(o)}</span></label>`).join('')}
    <label class="opt"><input type="checkbox" id="cb-${qn}-${g||'x'}-other" data-ms="${qn}" data-g="${g}" value="__other" ${a.otherOn?'checked':''}><span>Other</span></label></div>
    ${(a.other||[]).length?`<div class="chips">${a.other.map((o,i)=>`<span class="chip">${esc(o)}<button data-a="other-rm" data-q="${qn}" data-g="${g}" data-i="${i}" aria-label="Remove ${esc(o)}">×</button></span>`).join('')}</div>`:''}
    ${a.otherOn?`<div class="otherbox"><label for="${oid}" class="lbl">${esc(otherLbl)}</label><input id="${oid}" type="text" data-enter="other-add" data-q="${qn}" data-g="${g}"><div class="row end"><button class="btn sm" data-a="other-cancel" data-q="${qn}" data-g="${g}">Cancel</button><button class="btn sm primary" data-a="other-add" data-q="${qn}" data-g="${g}">Add</button></div></div>`:''}`;}
function uploadField(qn,a,accept,kind,label){
  const files=a.files||[];
  return `<div class="field"><span class="lbl req">${esc(label)}</span>
    <div class="drop" data-drop="${qn}" data-accept="${accept}">
      <span class="small muted">Drag & drop file here</span>

      <span class="small muted">${kind==='ZIP'?'.zip · registered by SHA-256 fingerprint':'PDF · up to 20 MB stored with the application'}</span>
      ${S.uploading===qn?'<span class="small"><b>Processing…</b></span>':''}
    </div>
    ${files.length?`<div class="files">${files.map((f,i)=>fileRow(f,`<button class="btn sm" data-a="file-rm" data-q="${qn}" data-i="${i}">Remove</button>`)).join('')}</div>`:''}</div>`;}
function fileRow(f,action){
  const ext=(f.name.split('.').pop()||'').toUpperCase().slice(0,4);
  const link=f.assetId?`<a href="/_blob/${esc(f.assetId)}" target="_blank" rel="noopener">${esc(f.name)}</a>`:esc(f.name);
  const note=f.sample?'Example file (sample data)':f.assetId?fmtSize(f.size)+' · stored':fmtSize(f.size)+' · fingerprint only';
  return `<div class="file"><span class="fi">${esc(ext)}</span><div class="fn">${link}<div class="small muted">${note}</div>${f.sha256&&!f.sample?`<div class="hash">SHA-256 ${esc(f.sha256)}</div>`:''}</div>${action||''}</div>`;}

function stepReview(d){
  const qs=appQuestions(d);const ans=d.answers||{};const missing=qs.filter(q=>!qComplete(q,ans[q]));
  const m=d.meta||{};
  return `<section class="card stack lg">
    <div class="section-h"><h3>Review & submit</h3>${missing.length?`<span class="pill open">${missing.length} question${missing.length>1?'s':''} incomplete</span>`:'<span class="pill pass">Ready to submit</span>'}</div>

    ${S.confirm==='submit-app'?`<div class="confirm"><b>Submit this application for assessment?</b><p class="small">Your responses and documents lock on submission and pass to the tester. You cannot change them afterwards.</p><div class="row"><button class="btn primary" data-a="submit-app">Submit application</button><button class="btn" data-a="cancel-confirm">Cancel</button></div></div>`:
    `<div class="qfoot"><button class="btn quiet" data-a="goto-step" data-step="assurance">← Back to questions</button><div class="row">${missing.length?`<span class="small muted">Answer every question and attach the required documents to submit.</span>`:''}<button class="btn primary" data-a="ask-submit" ${missing.length?'disabled':''}>Submit application</button></div></div>`}
  </section>`;}
function reviewBody(d,editable){
  const qs=appQuestions(d);const ans=d.answers||{};const m=d.meta||{};const g=d.gates||{};
  return `<dl class="kv"><dt>Vendor</dt><dd>${esc(m.vendor||'—')}</dd><dt>Component</dt><dd>${esc(m.component||'—')} · ${esc(m.model||'')}</dd><dt>Type</dt><dd>${esc(m.ctype||'—')}</dd><dt>Hardware / firmware</dt><dd>${esc(m.hw||'—')} / ${esc(m.fw||'—')}</dd><dt>Declared level</dt><dd>SL ${d.sl}</dd><dt>Applicable requirements</dt><dd class="tnum">${applicable(d).length} of ${REQS.length}</dd></dl>

    <div class="stack">${qs.map(q=>{const ok=qComplete(q,ans[q]);return `<div class="art"><div class="row between"><div class="aq"><span class="mono">Q${q}</span>${esc(QUESTIONS[q].t)}</div>${ok?'':`<span class="pill open">Incomplete</span>`}</div>${ok?answerView(q,ans[q]):`<p class="small muted">${esc(missingFor(q,ans[q]))}</p>`}${editable&&!ok?`<div><button class="btn sm" data-a="goto-qn" data-q="${q}">Answer Q${q}</button></div>`:''}</div>`;}).join('')}</div>`;}
function vendorLocked(d){
  const asmt=Store.asmts[d.id];const st=appStatus(d,asmt);const c=verdictCounts(d,asmt);
  return `<div class="apphead"><div class="stack" style="gap:6px"><span class="eyebrow">${esc(d.id)}</span><h2>${esc(d.meta?.component||'')}</h2>
    <div class="meta"><span>${esc(d.meta?.vendor||'')}</span><span>Declared SL ${d.sl}</span><span class="pill ${st.k}">${st.t}</span></div></div><button class="btn quiet" data-a="apps">← All applications</button></div>
  <div class="banner ${st.k==='done'?'ok':''}"><b>Submitted ${fmtDate(d.submittedAt)}.</b><span>Responses are locked.${st.k==='done'?' The compliance report is ready.':st.k==='prog'?` The tester has assessed ${c.done} of ${c.total} requirements.`:' Waiting for a tester to start the assessment.'}</span>${st.k==='done'?`<button class="btn sm primary" data-a="open-report" data-id="${esc(d.id)}">View compliance report</button>`:''}</div>
  <section class="card stack lg"><h3>Submitted responses</h3>${reviewBody(d,false)}</section>`;}

function answerView(qn,a){
  const q=QUESTIONS[qn];if(!a)return '<p class="small muted">No answer recorded.</p>';
  let h='';
  const list=(x)=>{const all=(x.sel||[]).concat((x.other||[]).map(o=>'Other: '+o));return all.length?`<div class="chips">${all.map(o=>`<span class="chip">${esc(o)}</span>`).join('')}</div>`:'<span class="small muted">None selected</span>';};
  if(q.type==='multi'||q.type==='multidoc')h+=list(a);
  if(q.type==='groups')h+=q.groups.map(G=>`<div><div class="small muted" style="margin-bottom:4px">${esc(G.label)}</div>${list((a.groups||{})[G.k]||{})}</div>`).join('');
  if(q.type==='single')h+=`<div class="chips"><span class="chip">${esc(a.one==='Other'?'Other: '+(a.otherText||''):a.one||'—')}</span></div>`;
  if(q.type==='text')h+=`<div class="ans">${esc(a.text||'')}</div>`;
  if(q.type==='number')h+=`<div class="ans"><b class="tnum">${a.na?'Not supported by the component':esc(a.num)+' '+esc(q.unit)}</b></div>`;
  if((a.files||[]).length)h+=`<div class="files">${a.files.map(f=>fileRow(f,'')).join('')}</div>`;
  if((a.notes||'').trim())h+=`<div class="small"><span class="muted">Vendor notes: </span>${esc(a.notes)}</div>`;
  return h;}

function testerApp(){
  const app=Store.apps[S.appId];if(!app)return `<div class="card empty"><p>This application is no longer available.</p><button class="btn" data-a="apps">Back to applications</button></div>`;
  const asmt=Store.asmts[S.appId]||{};const v=asmt.verdicts||{};const done=asmt.status==='completed';

  if(!S.reqId||!reqs.find(r=>r.id===S.reqId))S.reqId=(reqs.find(r=>!v[r.k])||reqs[0]||{}).id;
  const shown=S.filter==='open'?reqs.filter(r=>!v[r.k]):reqs;
  const groups=FRS.map(f=>({f,rs:shown.filter(r=>r.fr===f.k)})).filter(x=>x.rs.length);
  const st=appStatus(app,asmt);
  return `<div class="apphead"><div class="stack" style="gap:6px"><span class="eyebrow">${esc(S.appId)} · submitted ${fmtDay(app.submittedAt)}</span><h2>${esc(app.meta?.component||'')}</h2>
      <div class="meta"><span>${esc(app.meta?.vendor||'')}</span><span>${esc(app.meta?.model||'')}</span><span>FW ${esc(app.meta?.fw||'—')}</span><span>Declared SL ${app.sl}</span><span class="pill ${st.k}">${st.t}</span></div></div>
    <div class="row"><button class="btn quiet" data-a="apps">← Applications</button>${done?`<button class="btn primary" data-a="open-report" data-id="${esc(S.appId)}">View compliance report</button>`:`<button class="btn primary" data-a="ask-finish" ${c.done<c.total?'disabled':''}>Submit assessment</button>`}</div></div>
  <div class="card stack" style="padding:14px 18px;gap:8px"><div class="row between"><span class="small"><b class="tnum">${c.done} of ${c.total}</b> requirements assessed · <span style="color:var(--pass)" class="tnum">${c.pass} pass</span> · <span style="color:var(--fail)" class="tnum">${c.fail} fail</span></span><span class="small muted">${REQS.length-c.total} excluded by the filters</span></div>

  ${S.confirm==='finish'?`<div class="confirm"><b>Submit the completed assessment?</b><p class="small">All ${c.total} requirements have a verdict (${c.pass} pass, ${c.fail} fail). Submitting locks the verdicts and generates the compliance report.</p><div class="row"><button class="btn primary" data-a="finish">Submit assessment</button><button class="btn" data-a="cancel-confirm">Cancel</button></div></div>`:''}
  <div class="split">
    <aside class="pane sticky"><div class="pane-h"><div class="row between"><b>Requirement list</b><div class="seg" role="group"><button data-a="filter" data-f="all" aria-pressed="${S.filter==='all'}">All ${reqs.length}</button><button data-a="filter" data-f="open" aria-pressed="${S.filter==='open'}">Outstanding ${c.total-c.done}</button></div></div></div>
      <div class="pane-b">${groups.length?groups.map(({f,rs})=>`<div class="frhead">FR${f.n} · ${esc(f.name)}</div>${rs.map(r=>{const x=v[r.k];return `<button class="ritem" data-a="pick-req" data-r="${esc(r.id)}" ${r.id===S.reqId?'aria-current="true"':''}><span class="dot ${x?x.v==='pass'?'ok':'fail':''}"></span><span style="min-width:0"><span class="rid">${esc(r.id)} · ${esc(r.cr)}</span><span class="rt">${esc(r.title)}</span></span><span class="small muted">${x?(x.v==='pass'?'Pass':'Fail'):''}</span></button>`;}).join('')}`).join(''):`<div class="empty"><p>No outstanding requirements.</p></div>`}</div></aside>
    <section class="pane">${S.reqId?reqDetail(app,asmt,REQ[S.reqId],done):''}</section>

function repoLink(r){const t=(Store.config.repoTemplate||'').trim();if(!t)return '';return t.includes('{id}')?t.split('{id}').join(encodeURIComponent(r.id)):t;}
function reqDetail(app,asmt,r,done){

/* ---------- Report ---------- */
function reportData(id){
  const app=Store.apps[id];const asmt=Store.asmts[id]||{};if(!app)return null;
  const appl=applicable(app);const v=asmt.verdicts||{};
  const assessed=appl.map(r=>({r,x:v[r.k]||null}));
  const excluded=REQS.filter(r=>!appl.includes(r)).map(r=>({r,why:exclusion(r,app)}));
  const c=verdictCounts(app,asmt);
  const perFR=FRS.map(f=>({f,app:appl.filter(r=>r.fr===f.k).length,pass:assessed.filter(a=>a.r.fr===f.k&&a.x&&a.x.v==='pass').length,fail:assessed.filter(a=>a.r.fr===f.k&&a.x&&a.x.v==='fail').length,exc:excluded.filter(e=>e.r.fr===f.k).length}));
  return {app,asmt,assessed,excluded,c,perFR};}

    <div class="stack"><h3>Results by functional requirement</h3><div class="tw"><table><thead><tr><th>Functional requirement</th><th class="num">Assessed</th><th class="num">Pass</th><th class="num">Fail</th><th class="num">Excluded</th></tr></thead><tbody>
      ${perFR.map(x=>`<tr><td>FR${x.f.n} · ${esc(x.f.name)}</td><td class="num">${x.app}</td><td class="num">${x.pass}</td><td class="num">${x.fail}</td><td class="num">${x.exc}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Total</td><td class="num">${c.total}</td><td class="num">${c.pass}</td><td class="num">${c.fail}</td><td class="num">${excluded.length}</td></tr></tfoot></table></div></div>
    <div class="stack"><h3>Assessed requirements</h3><div class="tw"><table><thead><tr><th>Requirement</th><th>IEC 62443-4-2</th><th>Verdict</th><th>Justification</th></tr></thead><tbody>

async function sha256(file){try{const buf=await file.arrayBuffer();const h=await crypto.subtle.digest('SHA-256',buf);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}catch(e){return null;}}
async function addFiles(qn,fileList){
  const q=QUESTIONS[qn];const accept=q.type==='firmware'?'.zip':'.pdf';
  const files=[...fileList];if(!files.length)return;
  const a=ansDraft(qn);a.files=a.files||[];
  S.uploading=qn;render();
  for(const f of files){
    const ext='.'+(f.name.split('.').pop()||'').toLowerCase();
    if(ext!==accept){toast(`${f.name}: upload a ${accept} file for this question.`);continue;}
    if(q.type==='firmware')a.files=[];
    const rec={name:f.name,size:f.size,type:f.type||'',sha256:null,assetId:null,at:nowISO()};
    if(f.size<=1024*1024*1024)rec.sha256=await sha256(f);
    if(accept==='.pdf'){
      if(Store.assets&&f.size<=20*1024*1024){try{const r=await Store.assets.upload(f,{type:'application/pdf'});rec.assetId=r.id;}catch(e){toast(`${f.name} could not be stored (${e&&e.code||'error'}); it is registered by fingerprint only.`);}}
      else if(f.size>20*1024*1024)toast(`${f.name} is over 20 MB; it is registered by fingerprint only.`);
    }
    a.files.push(rec);
  }
  S.uploading=null;render();}

function ansDraft(qn){const d=S.draft;d.answers=d.answers||{};d.answers[qn]=d.answers[qn]||{};return d.answers[qn];}
function multiTarget(qn,g){const a=ansDraft(qn);if(!g)return a;a.groups=a.groups||{};a.groups[g]=a.groups[g]||{};return a.groups[g];}
function setPath(obj,path,val){const p=path.split('.');let o=obj;for(let i=0;i<p.length-1;i++){o[p[i]]=o[p[i]]||{};o=o[p[i]];}o[p[p.length-1]]=val;}
function openVendorApp(id){
  const a=Store.apps[id];if(!a)return;
  S.draft=Object.assign(clone(a),{id});S.appId=id;S.view='vendor';S.confirm=null;
  if(a.status!=='draft'){S.step='review';}
  else if(!a.sl)S.step='sl';else if(!gatesDone(a))S.step='gates';
  else{const qs=appQuestions(a);const i=qs.findIndex(q=>!qComplete(q,(a.answers||{})[q]));if(i<0)S.step='review';else{S.step='assurance';S.qi=i;}}
  render();window.scrollTo(0,0);}

  assess(el){S.appId=el.dataset.id||S.appId;S.view='tester';S.reqId=null;S.confirm=null;S.vd={};S.editObj=null;render();window.scrollTo(0,0);},
  filter(el){S.filter=el.dataset.f;render();},
  'pick-req'(el){S.reqId=el.dataset.r;S.editObj=null;render();if(window.innerWidth<900){const p=document.querySelectorAll('.split .pane')[1];if(p)p.scrollIntoView({block:'start'});}},
  'vd-set'(el){const k=el.dataset.k;const ta=document.getElementById('vj-'+k);const cur=S.vd[k]||{};S.vd[k]={v:el.dataset.v,j:ta?ta.value:(cur.j||'')};render();},
  async 'vd-save'(el){
    const r=REQ[el.dataset.r];const ta=document.getElementById('vj-'+r.k);const d=S.vd[r.k]||{};const j=(ta?ta.value:d.j||'').trim();
    const prev=((Store.asmts[S.appId]||{}).verdicts||{})[r.k];const v=d.v||(prev&&prev.v);
    if(!v){toast('Choose Pass or Fail.');return;}
    if(j.length<10){toast('Write a justification (at least 10 characters). It is required for Pass and Fail.');return;}
    const t=nowISO();
    const patch={verdicts:{[r.k]:{v,j,at:t,by:Store.me.id||'local'}},status:'in_progress',testerId:Store.me.id||'local',updatedAt:t};
    if(!(Store.asmts[S.appId]||{}).startedAt)patch.startedAt=t;
    const ok=await attempt(()=>Store.putAsmt(S.appId,patch),`${r.id} recorded as ${v==='pass'?'Pass':'Fail'}`);if(!ok)return;
    delete S.vd[r.k];
    if(!prev){const app=Store.apps[S.appId];const vs=(Store.asmts[S.appId]||{}).verdicts||{};const reqs=applicable(app);const i=reqs.findIndex(x=>x.id===r.id);
      const next=reqs.slice(i+1).concat(reqs.slice(0,i)).find(x=>!vs[x.k]);if(next)S.reqId=next.id;}
    render();},
  'ask-finish'(){S.confirm='finish';render();window.scrollTo(0,0);},
  async finish(){
    const app=Store.apps[S.appId];const c=verdictCounts(app,Store.asmts[S.appId]);if(c.done<c.total){toast('Every requirement needs a verdict first.');return;}
    const t=nowISO();const ok=await attempt(()=>Store.putAsmt(S.appId,{status:'completed',completedAt:t,summary:{assessed:c.total,pass:c.pass,fail:c.fail},updatedAt:t}),'Assessment submitted. Compliance report generated.');
    if(ok){S.confirm=null;S.view='report';render();window.scrollTo(0,0);}},
  'open-report'(el,e){e&&e.stopPropagation();S.appId=el.dataset.id||S.appId;S.view='report';render();window.scrollTo(0,0);},
  'obj-edit'(el){S.editObj=el.dataset.k;render();const t=document.getElementById('obj-'+el.dataset.k);if(t)t.focus();},
  'obj-cancel'(){S.editObj=null;render();},
  async 'obj-save'(el){const k=el.dataset.k;const t=document.getElementById('obj-'+k);const v=(t&&t.value||'').trim();
    const ok=await attempt(()=>Store.putConfig({objectives:{[k]:v}}),'Objective saved');if(ok){S.editObj=null;render();}},
  'toggle-settings'(){S.showSettings=!S.showSettings;render();},
  async 'save-settings'(){const v=($('#cfg-repo').value||'').trim();if(v&&!/^https?:\/\//i.test(v)){toast('Enter a full URL starting with https://');return;}
    const ok=await attempt(()=>Store.putConfig({repoTemplate:v}),'Repository link saved');if(ok){S.showSettings=false;render();}},
  'dl-html'(){const d=reportData(S.appId);offerDownload(`62443-4-2_Compliance_Report_${S.appId}.html`,reportStandalone(d),'text/html');},
  'dl-csv'(){const d=reportData(S.appId);offerDownload(`62443-4-2_Compliance_Report_${S.appId}.csv`,reportCSV(d),'text/csv');},
  'map-sl'(el){S.mapSL=+el.dataset.sl;render();},
  'map-gate'(el){S.mapGates[el.dataset.g]=!S.mapGates[el.dataset.g];render();}
};

const inIcs=e=>!!(e.target&&e.target.closest&&e.target.closest('[data-ics]'));
root.addEventListener('click',e=>{
  if(!inIcs(e))return;
  const el=e.target.closest('[data-a]');if(!el||!root.contains(el))return;
  if(e.target.closest('a'))return;
  const fn=A[el.dataset.a];if(!fn)return;
  if(el.tagName==='BUTTON')e.preventDefault();
  fn(el,e);});
root.addEventListener('input',e=>{
  if(!inIcs(e))return;
  const t=e.target;
  if(t.dataset.f&&S.draft){setPath(S.draft,t.dataset.f,t.value);return;}
  if(t.dataset.qa&&S.draft){const a=ansDraft(+t.dataset.q);if(t.dataset.qa==='num'){a.num=t.value===''?null:Number(t.value);}else a[t.dataset.qa]=t.value;return;}
  if(t.dataset.vj){const k=t.dataset.vj;const prev=((Store.asmts[S.appId]||{}).verdicts||{})[k];S.vd[k]=Object.assign({v:prev?prev.v:''},S.vd[k]||{},{j:t.value});}});
root.addEventListener('change',e=>{
  if(!inIcs(e))return;
  const t=e.target;
  if(t.dataset.f&&S.draft&&t.tagName==='SELECT'){setPath(S.draft,t.dataset.f,t.value);return;}
  if(t.dataset.ms&&S.draft){const qn=+t.dataset.ms;const x=multiTarget(qn,t.dataset.g);
    if(t.value==='__other'){x.otherOn=t.checked;if(!t.checked)x.other=[];}
    else{x.sel=x.sel||[];if(t.checked){if(!x.sel.includes(t.value))x.sel.push(t.value);}else x.sel=x.sel.filter(v=>v!==t.value);}
    render();if(t.value==='__other'&&t.checked){const n=document.getElementById(`oth-${qn}-${t.dataset.g||'x'}`);if(n)n.focus();}return;}
  if(t.dataset.qs&&S.draft){const a=ansDraft(+t.dataset.qs);a.one=t.value;if(t.value!=='Other')a.otherText='';render();return;}
  if(t.dataset.qna&&S.draft){const a=ansDraft(+t.dataset.qna);a.na=t.checked;render();return;}
  if(t.dataset.up&&S.draft){addFiles(+t.dataset.up,t.files);t.value='';return;}
  if(t.dataset.mapfr){S.mapFR=t.value;render();}});
root.addEventListener('keydown',e=>{
  if(!inIcs(e))return;
  const t=e.target;if(e.key==='Enter'&&t.dataset.enter){e.preventDefault();A[t.dataset.enter](t);}});
root.addEventListener('dragover',e=>{if(!inIcs(e))return;const d=e.target.closest('[data-drop]');if(!d)return;e.preventDefault();d.classList.add('over');});
root.addEventListener('dragleave',e=>{if(!inIcs(e))return;const d=e.target.closest('[data-drop]');if(d)d.classList.remove('over');});
root.addEventListener('drop',e=>{if(!inIcs(e))return;const d=e.target.closest('[data-drop]');if(!d)return;e.preventDefault();d.classList.remove('over');if(S.draft&&e.dataTransfer)addFiles(+d.dataset.drop,e.dataTransfer.files);});

render();
Store.init();
})();

</script>
